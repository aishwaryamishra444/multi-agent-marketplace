# Model registry for the reproduction.
#
# Each key is a short name used on the command line (--models) and in output
# file names. Values set the environment variables that Magentic Marketplace's
# LLM clients read (LLM_PROVIDER, LLM_MODEL, OPENAI_BASE_URL, ...).
#
# ${VAR} is expanded from your environment / .env at run time.

models:
  # --- OpenAI (closest to the paper's own setup) ---
  gpt-5-nano:            # cheap model for smoke tests
    provider: openai
    model: gpt-5-nano
  gpt-4o:
    provider: openai
    model: gpt-4o
  gpt-4o-mini:           # not a paper model; cheap and capable, for development runs
    provider: openai
    model: gpt-4o-mini
  gpt-4.1:
    provider: openai
    model: gpt-4.1
  gpt-5:
    provider: openai
    model: gpt-5

  # --- Anthropic ---
  claude-sonnet-4-5:
    provider: anthropic
    model: claude-sonnet-4-5

  # --- Google ---
  gemini-2.5-flash:      # the paper's model; Google no longer offers it to new API users
    provider: gemini
    model: gemini-2.5-flash
    max_concurrency: 8   # upstream lowers concurrency for Gemini
  gemini-3.8-flash:      # current Flash model, for accounts without 2.5 access
    provider: gemini
    model: gemini-3.8-flash
    max_concurrency: 8

  # --- Self-hosted via vLLM (OpenAI-compatible endpoint) ---
  # Start vLLM with e.g.:  vllm serve Qwen/Qwen3-14B --port 8001
  qwen3-14b:
    provider: openai
    model: Qwen/Qwen3-14B
    base_url: ${VLLM_BASE_URL}
    api_key: ${VLLM_API_KEY}
  qwen3-4b:
    provider: openai
    model: Qwen/Qwen3-4B-Instruct-2507
    base_url: ${VLLM_BASE_URL}
    api_key: ${VLLM_API_KEY}
  gpt-oss-20b:
    provider: openai
    model: openai/gpt-oss-20b
    base_url: ${VLLM_BASE_URL}
    api_key: ${VLLM_API_KEY}

  # --- Local on a laptop via Ollama (free, slow; no GPU server needed) ---
  # Install from ollama.com, then:  ollama pull qwen3:4b
  # If you pull a different tag (see ollama.com/library/qwen3), change `model` below to match.
  qwen3-4b-ollama:
    provider: openai
    model: qwen3:4b
    base_url: http://localhost:11434/v1
    api_key: ollama
    max_concurrency: 2

  # Same as the paper's Qwen3-4B-Instruct-2507 (no "thinking" step, so much faster than qwen3:4b).
  # Download once with:  ollama pull hf.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
  qwen3-4b-instruct-ollama:
    provider: openai
    model: hf.co/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
    base_url: http://localhost:11434/v1
    api_key: ollama
    max_concurrency: 2
